<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CloudTasks, gestor de tareas personales y de equipo.">
  <link rel="stylesheet" href="css/styless.css">
  <title>CloudTasks | Mis tareas</title>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#inicio" aria-label="CloudTasks, inicio"><span class="brand-mark" aria-hidden="true">✓</span><span>CloudTasks</span></a>
    <p class="header-message">Organiza lo importante, un día a la vez.</p>
  </header>
  <main id="inicio" class="app-shell">
    <section class="intro" aria-labelledby="page-title">
      <div><p class="eyebrow">PANEL PERSONAL</p><h1 id="page-title">Mis tareas</h1><p class="intro-text">Mantén tus pendientes claros y avanza con foco.</p></div>
      <div class="progress-card" aria-label="Progreso de tareas"><strong id="progress-count">0 de 0</strong><span id="progress-label">tareas completadas</span><div class="progress-track" aria-hidden="true"><span id="progress-bar"></span></div></div>
    </section>
    <section class="workspace">
      <aside class="task-form-card" aria-labelledby="new-task-title">
        <div class="section-heading"><span class="heading-icon" aria-hidden="true">+</span><h2 id="new-task-title">Nueva tarea</h2></div>
        <form id="task-form">
          <div class="field">
            <label for="task-title">Título</label>
            <input id="task-title" name="title" type="text" placeholder="Ej. Preparar presentación">
            <span class="error-text" id="title-error" aria-live="polite"></span>
          </div>
          <div class="field"><label for="task-description">Descripción</label><textarea id="task-description" name="description" rows="4" placeholder="Agrega los detalles de tu tarea"></textarea></div>
          <div class="form-grid">
              <div class="field">
                <label for="task-deadline">Fecha límite</label>
                <input id="task-deadline" name="deadline" type="date">
                <span class="error-text" id="deadline-error" aria-live="polite"></span>
              </div>
              <div class="field"><label for="task-priority">Prioridad</label>
                  <select id="task-priority" name="priority">
                      <option value="medium">Media</option>
                      <option value="high">Alta</option>
                      <option value="low">Baja</option>
                  </select>
              </div>
          </div>
          <div class="form-actions">
            <button id="submit-task-button" class="primary-button" type="submit">Agregar tarea <span aria-hidden="true">→</span></button>
            <button id="cancel-edit-button" class="secondary-button" type="button" hidden>Cancelar</button>
          </div>
        </form>
      </aside>
      <section class="tasks-card" aria-labelledby="task-list-title">
        <div class="tasks-header">
          <div><h2 id="task-list-title">Tareas pendientes</h2><p id="task-summary">Cargando tareas...</p></div>
          <div class="filter-controls">
            <div id="filter-panel" class="filter-panel">
              <div class="filter-field"><label for="filter-priority">Prioridad</label><select id="filter-priority"><option value="todas">Todas</option><option value="alta">Alta</option><option value="media">Media</option><option value="baja">Baja</option></select></div>
              <div class="filter-field"><label for="filter-status">Estado</label><select id="filter-status"><option value="todas">Todas</option><option value="incompletas">Incompletas</option><option value="completadas">Completadas</option></select></div>
              <button id="apply-filters" class="apply-filter-button" type="button">Aplicar filtros</button>
            </div>
          </div>
        </div>
        <ul id="task-list" class="task-list">
        </ul>
      </section>
    </section>
  </main>
  <footer class="site-footer">CloudTasks · Gestión de tareas simple y clara</footer>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/logica.js"></script>
</body>
</html>
